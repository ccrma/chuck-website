<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://chuck.stanford.edu/doc/images/chuck-logo2023w.png" type="image/png">
    <!-- include ACE editor and webchuck basic styles -->
    <script src="https://cdn.jsdelivr.net/gh/ccrma/webchuck-ide@main/cdn/ace/ace.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/ccrma/webchuck-ide@main/cdn/ace/editor.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/ccrma/webchuck-ide@main/cdn/webchuck.css">
    <link rel="stylesheet" href="/css/main.css" type="text/css">
    <style>
        /* ChuGL canvas, lined up with the editor below it. */
        .canvas-container {
            max-width: 960px;
            width: 90vw;
            aspect-ratio: 16 / 9;
            min-height: 0;
            overflow: hidden;
            margin: 1rem auto;
            background-color: #000;
            border: 1px solid #ccc;
        }

        #canvas {
            display: block;
        }

        .editor-container {
            height: 24rem;
            min-height: 12rem;
        }

        /* Console output, lined up with the editor above it */
        #chuck-console {
            box-sizing: border-box;
            max-width: 960px;
            width: 90vw;
            height: 8rem;
            margin: 0 auto 1rem auto;
            padding: 0.5rem 1rem;
            overflow: auto;
            white-space: pre-wrap;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 0.85rem;
            background-color: #fafafa;
            border: 1px solid #ccc;
            text-align: left;
        }

        #chuck-console:empty::before {
            content: "Console Output Appears Here!";
            opacity: 0.5;
        }

        button {
          border-radius: 0;
        }

        .button-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 10px;
          place-items: center; 
          max-width: 960px;
          width: 90vw;
          margin: 1rem auto 0;
          padding-top: 1rem;
          border: 1px solid #ccc
        }

        #openInIDE, #download {
          top: auto;
          right: 0;
          background-color: transparent;
          border-color: #333;
          color: #333;
          padding: 0.5rem 0.3rem;
          opacity: 0.8;
          position: relative;
        }
        #openInIDE:hover, #download:hover {
          opacity: 0.5;
        }
        #openInIDE:active, #download:active {
          opacity: 1;
        }

        /* Same look as the WebChucK IDE button (webchuck.css styles that one by id) */
        #download {
          border-color: #333;
          color: #333;
          background-color: transparent;
          padding: 0.5rem;
          opacity: 0.8;
          font-size: 0.8rem;
          margin-left: 2rem;
        }

        #download:hover {
          filter: invert(.7);
        }


    </style>
    <!-- main javascript code -->
    <script type="module">
      import ChuGL from 'https://cdn.jsdelivr.net/npm/webchugl/+esm';

      const CHUCK_FILE = "../education/basic-filters.ck";
      const VFS_PATH = "/education/basic-filters.ck";
      const ASSETS = JSON.parse('[]');

      // WebChucK IDE build with WebChuGL support (opened with ?engine=webchugl below).
      // TODO: switch to https://chuck.stanford.edu/ide/ once WebChuGL support is released upstream
      const IDE_URL = 'https://ccrma.stanford.edu/~hoangben/webchuck-ide/';

      const editor = newChuckEditor(document.getElementById("editor"), "// loading " + CHUCK_FILE + "...");

      const states = Object.freeze({
        playing: 0,
        stopped: 1
      });
      let status = states.stopped;

      const action = document.querySelector('#action');
      const openInIDE = document.querySelector('#openInIDE');
      const downloadButton = document.querySelector('#download');
      const consoleOutput = document.querySelector('#chuck-console');
      const canvas = document.querySelector('#canvas');

      let theChuck; // global variable
      let assetsLoaded = false;

      // Load the example's source into the editor
      fetch(CHUCK_FILE)
        .then((response) => {
          if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
          return response.text();
        })
        .then((code) => editor.setValue(code, -1))
        .catch((error) => {
          editor.setValue(`// could not load ${CHUCK_FILE}: ${error.message}`, -1);
        });

      // WebChuGL renders with WebGPU; disable Play if the browser doesn't have it
      if (!navigator.gpu) {
        action.disabled = true;
        printToConsole('WebGPU is not available in this browser, so WebChuGL cannot run. Try a recent Chrome, Edge, or Safari.');
      }

      // Show ChucK's output (<<< >>>, chout, errors) in the console panel.
      // textContent, not innerHTML, so output is never interpreted as HTML.
      function printToConsole(message) {
        consoleOutput.textContent += message + '\n';
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
      }

      async function loadAssets() {
        action.innerHTML = "Loading files...";
        const results = await Promise.allSettled(ASSETS.map(({ url, path }) => {
          const absoluteURL = new URL(url, location.href).href;
          return path.endsWith('.mpg')
            ? theChuck.loadVideo(absoluteURL, path)
            : theChuck.loadFile(absoluteURL, path);
        }));
        results.forEach((result, i) => {
          if (result.status === 'rejected') {
            printToConsole(`[webchugl] could not load ${ASSETS[i].url}: ${result.reason.message}`);
          }
        });
        assetsLoaded = true;
      }

      // Download button: saves the original .ck file that sits next to this page
      // (the page generator fills in data-href with this example's filename)
      downloadButton.addEventListener('click', () => {
        const link = document.createElement('a');
        link.href = downloadButton.dataset.href;
        link.download = ''; // keep the file's own name
        document.body.appendChild(link);
        link.click();
        link.remove();
      });

      // Play button
      action.addEventListener('click', async () => {
        // Initial load
        if (theChuck === undefined) {
          action.disabled = true;
          action.innerHTML = "Loading...";
          try {
            theChuck = await ChuGL.init({
              canvas: canvas,
              onProgress: (pct) => { action.innerHTML = `Loading... ${Math.round(pct)}%`; },
            });
          } catch (error) {
            printToConsole('[webchugl] failed to initialize: ' + error.message);
            action.innerHTML = "Unavailable";
            return;
          }
          theChuck.chuckPrint = printToConsole;
          action.disabled = false;
        }

        switch (status) {
          case states.playing:
            status = states.stopped;
            theChuck.reset(); // removes shreds and clears the ChuGL scene
            // Stop button
            action.innerHTML = `
              Play
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-play" viewBox="0 0 16 16">
                <path d="M10.804 8 5 4.633v6.734L10.804 8zm.792-.696a.802.802 0 0 1 0 1.392l-6.363 3.692C4.713 12.69 4 12.345 4 11.692V4.308c0-.653.713-.998 1.233-.696l6.363 3.692z"/>
              </svg>
            `;
            break;
          case states.stopped:
            consoleOutput.textContent = ''; // fresh console for each run
            if (!assetsLoaded) {
              action.disabled = true;
              await loadAssets();
              action.disabled = false;
            }
            // Run the editor's code from the example's own path so me.dir() finds its files
            theChuck.createFile(VFS_PATH, editor.getValue());
            const result = await theChuck.runFile(VFS_PATH);
            if (result.error) {
              // compile error is printed via chuckPrint; stay stopped
              action.innerHTML = `
              Play
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-play" viewBox="0 0 16 16">
                <path d="M10.804 8 5 4.633v6.734L10.804 8zm.792-.696a.802.802 0 0 1 0 1.392l-6.363 3.692C4.713 12.69 4 12.345 4 11.692V4.308c0-.653.713-.998 1.233-.696l6.363 3.692z"/>
              </svg>
            `;
              break;
            }
            status = states.playing;
            // Play button
            action.innerHTML = `
              Stop
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-stop" viewBox="0 0 16 16">
                <path d="M3.5 5A1.5 1.5 0 0 1 5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5zM5 4.5a.5.5 0 0 0-.5.5v6a.5.5 0 0 0 .5.5h6a.5.5 0 0 0 .5-.5V5a.5.5 0 0 0-.5-.5H5z"/>
              </svg>
            `;
            break;
        }
      });

      openInIDE.addEventListener('click', async () => {
        const ideWindow = window.open('about:blank', '_blank');
        if (!ideWindow) {
          alert('Please allow pop-ups to open your code in WebChucK IDE.');
          return;
        }
        ideWindow.opener = null;

        try {
          const title = document.querySelector('#title')?.textContent?.trim()
            || document.title.trim()
            || 'untitled';
          const fileName = `${title.replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_')}.ck`;
          const sharedFiles = [{ name: fileName, data: editor.getValue() }];
          const json = new TextEncoder().encode(JSON.stringify(sharedFiles));
          const compressed = await new Response(
            new Blob([json]).stream().pipeThrough(new CompressionStream('deflate'))
          ).arrayBuffer();
          const bytes = new Uint8Array(compressed);
          let binary = '';
          for (const byte of bytes) binary += String.fromCharCode(byte);

          const ideURL = new URL(IDE_URL);
          ideURL.searchParams.set('share', btoa(binary));
          ideURL.searchParams.set('engine', 'webchugl');
          ideWindow.location.href = ideURL.toString();
        } catch (error) {
          ideWindow.close();
          console.error('Could not create a WebChucK share link:', error);
          alert('Could not prepare the code for WebChucK IDE. See the console for details.');
        }
      });

      
    </script>
    <title>basic-filters</title>
</head>

<body>
    <header class="button-grid">
      
        <div class="leftText">
          <h2><span id="title" style="font-weight: bold">basic-filters</span></h2>
          <div id="author" style="font-style: italic;">ChucK Development Team</div>
        </div>

        <button id="openInIDE">=&gt; <em>to WebChucK IDE</em></button>
        <button id="download" data-href="../education/basic-filters.ck">Download .ck</button>

        <button id="action">
            Play
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-play"
                viewBox="0 0 16 16">
                <path
                    d="M10.804 8 5 4.633v6.734L10.804 8zm.792-.696a.802.802 0 0 1 0 1.392l-6.363 3.692C4.713 12.69 4 12.345 4 11.692V4.308c0-.653.713-.998 1.233-.696l6.363 3.692z">
                </path>
            </svg>
        </button>

    </header>

    <div class="canvas-container">
        <canvas id="canvas" aria-hidden="true"></canvas>
    </div>

    <main>
        <div class="editor-container">
            <div id="editor" class="ace_editor ace-chuck" style="width: 100%; height: 100%;"></div>
        </div>
    </main>

    <pre id="chuck-console" role="log" aria-label="ChucK console output"></pre>
</body>

</html>
