    <style>
        /* webchuck.css sizes the editor to the window minus 18rem; leave room for the console too */
        .editor-container {
            height: calc(100vh - 27rem);
            min-height: 12rem;
        }

        /* Console output, lined up with the editor above it */
        #chuck-console {
            box-sizing: border-box;
            max-width: 960px;
            width: 90vw;
            height: 8rem;
            margin: 0 auto 1rem auto;
            padding: 0.5rem 1rem;
            overflow: auto;
            white-space: pre-wrap;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 0.85rem;
            background-color: #fafafa;
            border: 1px solid #ccc;
            text-align: left;
        }

        #chuck-console:empty::before {
            content: "Console Output Appears Here!";
            opacity: 0.5;
        }

        button {
          border-radius: 0;
        }

        .button-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 10px;
          place-items: center; 
          max-width: 960px;
          width: 90vw;
          margin: 1rem auto 0;
          padding-top: 1rem;
          border: 1px solid #ccc
        }

        #openInIDE, #download {
          top: auto;
          right: 0;
          background-color: transparent;
          border-color: #333;
          color: #333;
          padding: 0.5rem 0.3rem;
          opacity: 0.8;
          position: relative;
        }
        #openInIDE:hover, #download:hover {
          opacity: 0.5;
        }
        #openInIDE:active, #download:active {
          opacity: 1;
        }

        /* Same look as the WebChucK IDE button (webchuck.css styles that one by id) */
        #download {
          border-color: #333;
          color: #333;
          background-color: transparent;
          padding: 0.5rem;
          opacity: 0.8;
          font-size: 0.8rem;
          margin-left: 2rem;
        }

        #download:hover {
          filter: invert(.7);
        }

    <script id="chuck" type="chuck">/////////////////////////////////////////////////////////////
// Elliptic                                                //
//                                                         //
// Elliptic implements cascaded IIR filters and a built-in //
// elliptical filter design. It is capable of low-pass,    //
// high-pass, or bandpass filtering with very steep        //
// slopes.                                                 //
//                                                         //
// The atten determines how much of the signal is          //
// attenuated outside the passband.                        //
//                                                         //
// Elliptic filters come with a trade-off for their steep  //
// slopes: they have a certain amount of ripple outside    //
// the passbands. A very small ripple (0.1 or 0.2 dB)      //
// produces very little ringing, whereas a large ripple    //
// (eg. 20 dB) produces a very strong harmonic ring.       //
//                                                         //
// The filter design algorithm sometimes can't fulfill the //
// design criteria -- a particular combination of cutoff   //
// frequencies, ripple, and attenuation. If that happens,  //
// the user is warned that the filter is not initialized,  //
// and the filter is bypassed. This may happen, for        //
// instance, if you ask for a very steep attenuation with  //
// very low ripple.                                        //
/////////////////////////////////////////////////////////////

// Settings
//
// atten (float): filter attenuation in dB. Default 90.0
// ripple (float): filter ripple in dB. Default 0.2
// bypass (int): switch bypass on or off. Default 0
//
// Before using the filter, you must initialize it as a
// low-pass (lpf), high-pass (hpf), or band-pass filter and
// designate the passband and stopband frequencies.
//
// lpf (passband Hz, stopband Hz): create a low-pass filter
// hpf (stopband Hz, passband Hz): create a high-pass filter
//
// bpf (lower passband, upper passband, stopband):
//   (usually these parameters are ascending values.)
//

Noise n => Elliptic ell => dac;
0.1 => n.gain;

80 => ell.atten; // 80 dB attenuation
10 => ell.ripple; // 10 dB ripple will cause ringing

ell.bpf(500,600,650); // create band-pass filter which
                      // passes the range 500-600 Hz
                      // unattenuated, then slopes from
                      // 600-650 Hz (and 450-500 Hz)

true => ell.bypass; // bypass filter
2::second => now;

false => ell.bypass; // activate filter
minute => now;</script>
    <!-- main javascript code -->
    <script type="inline-module">
      import { Chuck } from 'https://cdn.jsdelivr.net/npm/webchuck/+esm';
      import chuckCode from '#chuck';

      const editor = newChuckEditor(document.getElementById("editor"), chuckCode);

      const states = Object.freeze({
        playing: 0,
        stopped: 1
      });
      let status = states.stopped;

      const action = document.querySelector('#action');
      const openInIDE = document.querySelector('#openInIDE');
      const downloadButton = document.querySelector('#download');
      const consoleOutput = document.querySelector('#chuck-console');

      let theChuck; // global variable

      // Show ChucK's output (<<< >>>, chout, errors) in the console panel.
      // textContent, not innerHTML, so output is never interpreted as HTML.
      function printToConsole(message) {
        consoleOutput.textContent += message + '\n';
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
      }

      // Download button: saves the original .ck file that sits next to this page
      // (the page generator fills in data-href with this example's filename)
      downloadButton.addEventListener('click', () => {
        const link = document.createElement('a');
        link.href = downloadButton.dataset.href;
        link.download = ''; // keep the file's own name
        document.body.appendChild(link);
        link.click();
        link.remove();
      });

      // Play button
      action.addEventListener('click', async () => {
        // Initial load
        if (theChuck === undefined) {
          action.disabled = true;
          action.innerHTML = "Loading...";
          theChuck = await Chuck.init( [] );
          theChuck.chuckPrint = printToConsole;
          action.disabled = false;
        }

        switch (status) {
          case states.playing:
            status = states.stopped;
            theChuck.removeLastCode();
            // Stop button
            action.innerHTML = `
              Play
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-play" viewBox="0 0 16 16">
                <path d="M10.804 8 5 4.633v6.734L10.804 8zm.792-.696a.802.802 0 0 1 0 1.392l-6.363 3.692C4.713 12.69 4 12.345 4 11.692V4.308c0-.653.713-.998 1.233-.696l6.363 3.692z"/>
              </svg>
            `;
            break;
          case states.stopped:
            status = states.playing;
            consoleOutput.textContent = ''; // fresh console for each run
            theChuck.runCode(editor.getValue());
            // Play button
            action.innerHTML = `
              Stop
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-stop" viewBox="0 0 16 16">
                <path d="M3.5 5A1.5 1.5 0 0 1 5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5zM5 4.5a.5.5 0 0 0-.5.5v6a.5.5 0 0 0 .5.5h6a.5.5 0 0 0 .5-.5V5a.5.5 0 0 0-.5-.5H5z"/>
              </svg>
            `;
            break;
        }
      });

      openInIDE.addEventListener('click', async () => {
        const ideWindow = window.open('about:blank', '_blank');
        if (!ideWindow) {
          alert('Please allow pop-ups to open your code in WebChucK IDE.');
          return;
        }
        ideWindow.opener = null;

        try {
          const title = document.querySelector('#title')?.textContent?.trim()
            || document.title.trim()
            || 'untitled';
          const fileName = `${title.replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_')}.ck`;
          const sharedFiles = [{ name: fileName, data: editor.getValue() }];
          const json = new TextEncoder().encode(JSON.stringify(sharedFiles));
          const compressed = await new Response(
            new Blob([json]).stream().pipeThrough(new CompressionStream('deflate'))
          ).arrayBuffer();
          const bytes = new Uint8Array(compressed);
          let binary = '';
          for (const byte of bytes) binary += String.fromCharCode(byte);

          const ideURL = new URL('https://chuck.stanford.edu/ide/');
          ideURL.searchParams.set('share', btoa(binary));
          ideWindow.location.href = ideURL.toString();
        } catch (error) {
          ideWindow.close();
          console.error('Could not create a WebChucK share link:', error);
          alert('Could not prepare the code for WebChucK IDE. See the console for details.');
        }
      });

      
    </script>
