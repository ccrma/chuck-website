    <script id="chuck" type="chuck">//---------------------------------------------------------------------
// name: wekinator-basic.ck
// desc: basic example using the built-in Wekinator object in ChucK,
//       based on Rebecca Fiebrink's Wekinator framework;
//       This example adds two groups of 3-2 input-output
//       observations, trains, and predicts output based on new input.
//       default task: regression
//       default model: MLPs (one hidden layer with same # of nodes as input)
//
// version: need chuck version 1.5.0.0 or higher
// sorting: part of ChAI (ChucK for AI)
//
// uncomment for Wekinator API:
// Wekinator.help();
//
// authors: Yikai Li
//          Ge Wang (https://ccrma.stanford.edu/~ge/)
//          Rebecca Fiebrink (original Wekinator framework)
// date: Winter 2023
//---------------------------------------------------------------------

// instantiate a global Wekinator, so other files can access
global Wekinator wek;

// clear training observations
wek.clear();

// group count
1 => int groupNum;

cherr <= "-----------" <= IO.newline();
// add a group of data
addGroup( [0.1, 0.1, 0.1], [48.0, 60.0], 20 );
addGroup( [0.4, 0.4, 0.4], [5.0, 8.0], 20 );
addGroup( [0.8, 0.0, 0.4], [30.0, 30.0], 20 );
cherr <= "-----------" <= IO.newline();

// (optional) set model type; MLP is default
// AI.MLP => wek.modelType;
// (optional) set task type; regression is default
AI.Regression => wek.taskType;
// print
<<< "modelType:", wek.modelTypeName(),
    "| taskType:", wek.taskTypeName() >>>;

// (optional) set properties to your liking
// <<< "changing Wekinator MLP properties...", "" >>>;
// wek.setProperty( AI.MLP, "hiddenLayers", 1 );
// note: 0 nodesPerHiddenLayer means "same as input layer"
// wek.setProperty( AI.MLP, "nodesPerHiddenLayer", 0 );
// wek.setProperty( AI.MLP, "learningRate", 0.01 );
// wek.setProperty( AI.MLP, "epochs", 100 );

 // print model properties
<<< "Wekinator MLP hiddenLayers:", wek.getPropertyInt( AI.MLP, "hiddenLayers" ) >>>;
<<< "Wekinator MLP nodesPerHiddenLayer:", wek.getPropertyInt( AI.MLP, "nodesPerHiddenLayer" ) >>>;
<<< "Wekinator MLP learningRate", wek.getPropertyFloat( AI.MLP, "learningRate" ) >>>;
<<< "Wekinator MLP epochs:", wek.getPropertyInt( AI.MLP, "epochs" ) >>>;
// (optional) save the observations for loading later
// wek.exportObs( me.dir() + "currentData.arff" );

// print
cherr <= "-----------" <= IO.newline();
cherr <= "training..." <= IO.newline();
cherr <= "-----------" <= IO.newline();
// train using current training set
wek.train();

// new input
float x[];
// to hold predicted output
float y[2];

cherr <= "given new input, predict output..." <= IO.newline();
// predict and print
predict( [0.101, 0.1, 0.1], y );
predict( [0.401, 0.4, 0.4], y );
predict( [0.801, 0.0, 0.4], y );

// test run
repeat( 20 )
{
    // generate random input
    [Math.random2f(0,1), Math.random2f(0,1), Math.random2f(0,1)] @=> x;
    // predict and print
    predict( x, y );
    // advance time (just for effect)
    50::ms => now;
}


// add a group of training observations
fun void addGroup( float inputs[], float outputs[], int N )
{
    // print
    cherr <= "adding group " <= groupNum++;
    // collect data
    repeat( N )
    {
        // input and output (could be set in another file)
        wek.input( inputs ); wek.output( outputs );
        // add current input and output (typically these are different)
        wek.add();
        // print
        cherr <= ".";
        // advance time (delay on purpose to visualize the process)
        (300.0/N)::ms => now;
    }
    // print
    cherr <= IO.newline();
}

// predict and print
fun void predict( float inputs[], float outputs[] )
{
    // predict output based on input; 3 inputs -> 2 outputs
    wek.predict(inputs, outputs);
    // print
    cherr <= "(" <= inputs[0] <= ","<= inputs[1] <= ","<= inputs[2] <= ") -> ("
          <= outputs[0] <= ", " <= outputs[1] <= ")" <= IO.newline();
}</script>

    <script type="inline-module">
      import { Chuck } from 'https://cdn.jsdelivr.net/npm/webchuck/+esm';
      import chuckCode from '#chuck';

      const editor = newChuckEditor(document.getElementById("editor"), chuckCode);

      const states = Object.freeze({
        playing: 0,
        stopped: 1
      });
      let status = states.stopped;

      const action = document.querySelector('#action');
      const openInIDE = document.querySelector('#openInIDE');
      const downloadButton = document.querySelector('#download');
      const consoleOutput = document.querySelector('#chuck-console');

      let theChuck; // global variable

      // Show ChucK's output (<<< >>>, chout, errors) in the console panel.
      // textContent, not innerHTML, so output is never interpreted as HTML.
      function printToConsole(message) {
        consoleOutput.textContent += message + '\n';
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
      }

      // Download button: saves the original .ck file that sits next to this page
      // (the page generator fills in data-href with this example's filename)
      downloadButton.addEventListener('click', () => {
        const link = document.createElement('a');
        link.href = downloadButton.dataset.href;
        link.download = ''; // keep the file's own name
        document.body.appendChild(link);
        link.click();
        link.remove();
      });

      // Play button
      action.addEventListener('click', async () => {
        // Initial load
        if (theChuck === undefined) {
          action.disabled = true;
          action.innerHTML = "Loading...";
          theChuck = await Chuck.init( [] );
          theChuck.chuckPrint = printToConsole;
          action.disabled = false;
        }

        switch (status) {
          case states.playing:
            status = states.stopped;
            theChuck.removeLastCode();
            // Stop button
            action.innerHTML = `
              Play
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-play" viewBox="0 0 16 16">
                <path d="M10.804 8 5 4.633v6.734L10.804 8zm.792-.696a.802.802 0 0 1 0 1.392l-6.363 3.692C4.713 12.69 4 12.345 4 11.692V4.308c0-.653.713-.998 1.233-.696l6.363 3.692z"/>
              </svg>
            `;
            break;
          case states.stopped:
            status = states.playing;
            consoleOutput.textContent = ''; // fresh console for each run
            theChuck.runCode(editor.getValue());
            // Play button
            action.innerHTML = `
              Stop
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-stop" viewBox="0 0 16 16">
                <path d="M3.5 5A1.5 1.5 0 0 1 5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5zM5 4.5a.5.5 0 0 0-.5.5v6a.5.5 0 0 0 .5.5h6a.5.5 0 0 0 .5-.5V5a.5.5 0 0 0-.5-.5H5z"/>
              </svg>
            `;
            break;
        }
      });

      openInIDE.addEventListener('click', async () => {
        const ideWindow = window.open('about:blank', '_blank');
        if (!ideWindow) {
          alert('Please allow pop-ups to open your code in WebChucK IDE.');
          return;
        }
        ideWindow.opener = null;

        try {
          const title = document.querySelector('#title')?.textContent?.trim()
            || document.title.trim()
            || 'untitled';
          const fileName = `${title.replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_')}.ck`;
          const sharedFiles = [{ name: fileName, data: editor.getValue() }];
          const json = new TextEncoder().encode(JSON.stringify(sharedFiles));
          const compressed = await new Response(
            new Blob([json]).stream().pipeThrough(new CompressionStream('deflate'))
          ).arrayBuffer();
          const bytes = new Uint8Array(compressed);
          let binary = '';
          for (const byte of bytes) binary += String.fromCharCode(byte);

          const ideURL = new URL('https://chuck.stanford.edu/ide/');
          ideURL.searchParams.set('share', btoa(binary));
          ideWindow.location.href = ideURL.toString();
        } catch (error) {
          ideWindow.close();
          console.error('Could not create a WebChucK share link:', error);
          alert('Could not prepare the code for WebChucK IDE. See the console for details.');
        }
      });

      
    </script>
