    <script id="chuck" type="chuck">// name: smb.ck
// desc: a ChucK rendition of the Super Mario Bros.
//       "Ground Theme" by Koji Kondo.
//
// author: program by Wesley Burchell
// date: updated 11/18/2017

// melody
SqrOsc melody => dac;
// harmony
SqrOsc harmony => dac;
// bass
TriOsc bass => Bitcrusher8 bits => Gain bassGain => dac;
// filter and compressor
LPF filt => Dyno crush => Gain g => dac;
// drums
Noise drums => filt;

// model that 8-bit bass
class Bitcrusher8 extends Chugen
{
    fun float tick(float in)
    {
        return ((in * 8 ) $ int) / 8.0;
    }
}

// a few vars
int m, h, b, d;
// The following array shows the order of patterns in the song.
[7,0,1,0,1,2,3,2,4,2,3,2,4,5,6,5,7,0,1,0,1,8,9,8,10,8,9,8,10,5,6,5,7,8,9,8,10] @=> int seq[];

// compressor settings
crush.compress();
0.001 => crush.thresh;
1.0 => crush.slopeBelow;
0.0 => crush.slopeAbove;
1::samp => crush.attackTime;
1::samp => crush.releaseTime;
37.5 => g.gain;
0 => int time1;
0 => int time2;
0 => int pattern;
0.25 => float gain;
1 => bass.gain;
0.0 => melody.gain;
0.0 => harmony.gain;
0.0 => bassGain.gain;
0.0 => drums.gain;

// time loop
while( true )
{
    checkSqrNote( m, melody ) => m;
    checkSqrNote( h, harmony ) => h;
    checkTriNote();
    checkNoiNote();
    playPattern( seq[pattern] );
    // tick
    735::samp => now;
    time1++;
    if( time1 / 3 > 47 )
    {
        0 => time1;
        pattern++;
    }
    if( pattern == seq.size() ) // end of song
    {
        1 => pattern; // go back to the second pattern (1 )
    }
}

//{ Note checks. These test if a note should be played, and if so, they play the note.
fun int checkSqrNote( int amount, SqrOsc sqr )
{
    if( amount == 7 )
    {   
        0.5 * gain => sqr.gain;
    }
    else if( amount == 6 )
    {   
        0.4375 * gain => sqr.gain;
    }
    else if( amount == 5 )
    {   
        0.375 * gain => sqr.gain;
    }
    else if( amount == 4 )
    {   
        0.3125 * gain => sqr.gain;
    }
    else if( amount == 2 )
    {   
        0.25 * gain => sqr.gain;
    }
    else if( amount != 3 && amount != 1 )
    {   
        0.0 => sqr.gain;
    }
    if( amount > 0 )
    {
        1 -=> amount;
    }
    return amount;
}

fun void checkTriNote()
{
    if( b == 8 )
    {   
        0.0 => bass.phase;
        gain => bassGain.gain;
    }
    else if( b < 1 || b > 8 )
    {
        0.0 => bassGain.gain;
    }
    if( b > 0 )
    {
        1 -=> b;
    }
}

fun void checkNoiNote()
{
    if( d > 0 )
    {   
        .75 * gain => drums.gain;
        1 -=> d;
    }
    else
    {
        0.0 => drums.gain;
    }
}

fun void playPattern( int pat ) // This plays a specified pattern.
{
    if( pat == 0 )
    {
        melody1a();
        harmony1a();
        bass1a();
        drums1();
    }
    else if( pat == 1 )
    {
        melody1b();
        harmony1b();
        bass1b();
        drums1();
    }
    else if( pat == 2 )
    {
        melody2a();
        harmony2a();
        bass2a();
        drums1();
    }
    else if( pat == 3 )
    {
        melody2b();
        harmony2b();
        bass2b();
        drums1();
    }
    else if( pat == 4 )
    {
        melody2c();
        harmony2c();
        bass2c();
        drums1();
    }
    else if( pat == 5 )
    {
        melody3a();
        harmony3a();
        bass3a();
        drums3();
    }
    else if( pat == 6 )
    {
        melody3b();
        harmony3b();
        bass3a();
        drums3();
    }
    else if( pat == 7 )
    {
        melody3c();
        harmony3c();
        bass3b();
        drums3();
    }
    else if( pat == 8 )
    {
        melody4a();
        harmony4a();
        bass4a();
        drums4();
    }
    else if( pat == 9 )
    {
        melody4b();
        harmony4b();
        bass4b();
        drums4();
    }
    else if( pat == 10 )
    {
        melody4c();
        harmony4c();
        bass4c();
        drums4();
    }
}

//{ Note triggers. Each of these send a signal that at a specified time in a pattern,
// a note will be played at a specified pitch value.
fun void melNote( int t, int val)
{
    if( time1 == t * 3 )
    {
        if( val >= 0 && val < 128 )
        {
            Std.mtof(val) => melody.freq;
            8 => m;
        }
    }
}

fun void harNote( int t, int val)
{
    if( time1 == t * 3 )
    {
        if( val >= 0 && val < 128 )
        {
            Std.mtof(val) => harmony.freq;
            8 => h;
        }
    }
}

fun void basNote( int t, int val)
{
    if( time1 == t * 3 )
    {
        if( val >= 0 && val < 128 )
        {
            Std.mtof(val) => bass.freq;
            8 => b;
        }
    }
}

// Different values are given different durations (d) and different filter frequencies
// to simulate different drums.
fun void druNote( int t, int val)
{
    if( time1 == t * 3 )
    {
        if( val == 0 )
        {
            1 => d;
            900 => filt.freq;
            3 => filt.Q;
        }
        else if( val == 1 )
        {
            1 => d;
            20000 => filt.freq;
            0.01 => filt.Q;
        }
        else if( val == 2 )
        {
            4 => d;
            20000 => filt.freq;
            0.01 => filt.Q;
        }
    }
}

    <script type="inline-module">
      import { Chuck } from 'https://cdn.jsdelivr.net/npm/webchuck/+esm';
      import chuckCode from '#chuck';

      const editor = newChuckEditor(document.getElementById("editor"), chuckCode);

      const states = Object.freeze({
        playing: 0,
        stopped: 1
      });
      let status = states.stopped;

      const action = document.querySelector('#action');
      const openInIDE = document.querySelector('#openInIDE');
      const downloadButton = document.querySelector('#download');
      const consoleOutput = document.querySelector('#chuck-console');

      let theChuck; // global variable

      // Show ChucK's output (<<< >>>, chout, errors) in the console panel.
      // textContent, not innerHTML, so output is never interpreted as HTML.
      function printToConsole(message) {
        consoleOutput.textContent += message + '\n';
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
      }

      // Download button: saves the original .ck file that sits next to this page
      // (the page generator fills in data-href with this example's filename)
      downloadButton.addEventListener('click', () => {
        const link = document.createElement('a');
        link.href = downloadButton.dataset.href;
        link.download = ''; // keep the file's own name
        document.body.appendChild(link);
        link.click();
        link.remove();
      });

      // Play button
      action.addEventListener('click', async () => {
        // Initial load
        if (theChuck === undefined) {
          action.disabled = true;
          action.innerHTML = "Loading...";
          theChuck = await Chuck.init( [] );
          theChuck.chuckPrint = printToConsole;
          action.disabled = false;
        }

        switch (status) {
          case states.playing:
            status = states.stopped;
            theChuck.removeLastCode();
            // Stop button
            action.innerHTML = `
              Play
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-play" viewBox="0 0 16 16">
                <path d="M10.804 8 5 4.633v6.734L10.804 8zm.792-.696a.802.802 0 0 1 0 1.392l-6.363 3.692C4.713 12.69 4 12.345 4 11.692V4.308c0-.653.713-.998 1.233-.696l6.363 3.692z"/>
              </svg>
            `;
            break;
          case states.stopped:
            status = states.playing;
            consoleOutput.textContent = ''; // fresh console for each run
            theChuck.runCode(editor.getValue());
            // Play button
            action.innerHTML = `
              Stop
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-stop" viewBox="0 0 16 16">
                <path d="M3.5 5A1.5 1.5 0 0 1 5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5zM5 4.5a.5.5 0 0 0-.5.5v6a.5.5 0 0 0 .5.5h6a.5.5 0 0 0 .5-.5V5a.5.5 0 0 0-.5-.5H5z"/>
              </svg>
            `;
            break;
        }
      });

      openInIDE.addEventListener('click', async () => {
        const ideWindow = window.open('about:blank', '_blank');
        if (!ideWindow) {
          alert('Please allow pop-ups to open your code in WebChucK IDE.');
          return;
        }
        ideWindow.opener = null;

        try {
          const title = document.querySelector('#title')?.textContent?.trim()
            || document.title.trim()
            || 'untitled';
          const fileName = `${title.replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_')}.ck`;
          const sharedFiles = [{ name: fileName, data: editor.getValue() }];
          const json = new TextEncoder().encode(JSON.stringify(sharedFiles));
          const compressed = await new Response(
            new Blob([json]).stream().pipeThrough(new CompressionStream('deflate'))
          ).arrayBuffer();
          const bytes = new Uint8Array(compressed);
          let binary = '';
          for (const byte of bytes) binary += String.fromCharCode(byte);

          const ideURL = new URL('https://chuck.stanford.edu/ide/');
          ideURL.searchParams.set('share', btoa(binary));
          ideWindow.location.href = ideURL.toString();
        } catch (error) {
          ideWindow.close();
          console.error('Could not create a WebChucK share link:', error);
          alert('Could not prepare the code for WebChucK IDE. See the console for details.');
        }
      });

      
    </script>
    <title>smb</title>
</head>
