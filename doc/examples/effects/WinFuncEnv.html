    <script id="chuck" type="chuck">// WinFunEnv is an Attack/Release envelope built around window functions!

// ~options
//
// .set (duration, duration), default (0.0, 0.0)
//   sets duration for attack and release phase
//
// .attackTime (duration), default 0.0
//   sets length for the attack phase
//
// .releaseTime (duration), default 0.0
//   sets length for the release phase
//
// ~ the following window functions are available to use as envelopes
// ~ certain functions allow for custom coefficient values (ie setBlackman(0.64) )
//
// setBlackman()
// setBlackman(float a)
// setBlackmanHarris()
// setBlackmanDerivative (float a0, float a1, float a2, float a3);
// setBlackmanNutall()
// setExponential()
// setExponential(a)
// setHann()
// setHannPoisson()
// setHannPoisson(a)
// setNutall()
// setParzen()
// setPoisson()
// setPoisson(float a)
// setTukey()
// setTukey(float a)
// setWelch
//
// ~ hopefully further updates will see more windows being added (Kaiser, etc)

Noise nois => WinFuncEnv win1 => dac;

fun void playWindow(WinFuncEnv @ win, dur attack, dur release) {
    win.attackTime(attack);
    win.releaseTime(release);
    win.keyOn();
    attack => now;
    win.keyOff();
    release => now;
}

// sets Blackman Envelope with a default value of 0.16
win1.setBlackman();
<<< "Blackman Envelope with default value of 0.16 on white noise", "" >>>;
playWindow(win1, 2.5::second, 2.5::second);

// sets Blackman Envelope with a custom value
win1.setBlackman(Math.random2f(0.05, 0.25));
<<< "Blackman Envelope with a random custom value on white noise.", "" >>>;
playWindow(win1, 2.5::second, 2.5::second);

<<< "Blackman Envelope with a short attack and a long release..", "" >>>;
playWindow(win1, 100::ms, 3::second);

<<< "Blackman Envelope with a long attack and a short release..", "" >>>;
playWindow(win1, 3::second, 100::ms);

// sets BlackmanHarris Envelope
win1.setBlackmanHarris();
<<< "BlackmanHarris Envelope on white noise.", "" >>>;
playWindow(win1, 2.5::second, 2.5::second);

// replacing noise with a sine wave
nois =< win1;
SinOsc sin => win1;

// sets Parzen Envelope
win1.setParzen();
<<< "Parzen Window used for amplitude modulation on a sine wave", "" >>>;
for (int i; i < 25000; i++) {
    playWindow(win1, 0.1::ms, 0.1::ms);
}

// sets Hann Envelope
win1.setHann();
<<< "Hann Window used for amplitude modulation on a sine wave", "" >>>;
for (int i; i < 25000; i++) {
    playWindow(win1, 0.1::ms, 0.1::ms);
}

// removing sine wave, adding noise and a second envelope to be in series with the first
sin =< win1;
nois => win1 =< dac;
win1 => WinFuncEnv win2 => dac;

<<< "Two envelopes, one Parzen and one Welch in series with each other with slightly different envelope times.", "" >>>;
win1.setParzen();
win2.setWelch();

fun void loop(WinFuncEnv @ win, dur envTime) {
    repeat(500) {
        playWindow(win, envTime, envTime);
    }
}

spork ~ loop(win1, 70::ms);
loop(win2, 73::ms);</script>

    <script type="inline-module">
      import { Chuck } from 'https://cdn.jsdelivr.net/npm/webchuck/+esm';
      import chuckCode from '#chuck';

      const editor = newChuckEditor(document.getElementById("editor"), chuckCode);

      const states = Object.freeze({
        playing: 0,
        stopped: 1
      });
      let status = states.stopped;

      const action = document.querySelector('#action');
      const openInIDE = document.querySelector('#openInIDE');
      const downloadButton = document.querySelector('#download');
      const consoleOutput = document.querySelector('#chuck-console');

      let theChuck; // global variable

      // Show ChucK's output (<<< >>>, chout, errors) in the console panel.
      // textContent, not innerHTML, so output is never interpreted as HTML.
      function printToConsole(message) {
        consoleOutput.textContent += message + '\n';
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
      }

      // Download button: saves the original .ck file that sits next to this page
      // (the page generator fills in data-href with this example's filename)
      downloadButton.addEventListener('click', () => {
        const link = document.createElement('a');
        link.href = downloadButton.dataset.href;
        link.download = ''; // keep the file's own name
        document.body.appendChild(link);
        link.click();
        link.remove();
      });

      // Play button
      action.addEventListener('click', async () => {
        // Initial load
        if (theChuck === undefined) {
          action.disabled = true;
          action.innerHTML = "Loading...";
          theChuck = await Chuck.init( [] );
          theChuck.chuckPrint = printToConsole;
          action.disabled = false;
        }

        switch (status) {
          case states.playing:
            status = states.stopped;
            theChuck.removeLastCode();
            // Stop button
            action.innerHTML = `
              Play
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-play" viewBox="0 0 16 16">
                <path d="M10.804 8 5 4.633v6.734L10.804 8zm.792-.696a.802.802 0 0 1 0 1.392l-6.363 3.692C4.713 12.69 4 12.345 4 11.692V4.308c0-.653.713-.998 1.233-.696l6.363 3.692z"/>
              </svg>
            `;
            break;
          case states.stopped:
            status = states.playing;
            consoleOutput.textContent = ''; // fresh console for each run
            theChuck.runCode(editor.getValue());
            // Play button
            action.innerHTML = `
              Stop
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-stop" viewBox="0 0 16 16">
                <path d="M3.5 5A1.5 1.5 0 0 1 5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5zM5 4.5a.5.5 0 0 0-.5.5v6a.5.5 0 0 0 .5.5h6a.5.5 0 0 0 .5-.5V5a.5.5 0 0 0-.5-.5H5z"/>
              </svg>
            `;
            break;
        }
      });

      openInIDE.addEventListener('click', async () => {
        const ideWindow = window.open('about:blank', '_blank');
        if (!ideWindow) {
          alert('Please allow pop-ups to open your code in WebChucK IDE.');
          return;
        }
        ideWindow.opener = null;

        try {
          const title = document.querySelector('#title')?.textContent?.trim()
            || document.title.trim()
            || 'untitled';
          const fileName = `${title.replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_')}.ck`;
          const sharedFiles = [{ name: fileName, data: editor.getValue() }];
          const json = new TextEncoder().encode(JSON.stringify(sharedFiles));
          const compressed = await new Response(
            new Blob([json]).stream().pipeThrough(new CompressionStream('deflate'))
          ).arrayBuffer();
          const bytes = new Uint8Array(compressed);
          let binary = '';
          for (const byte of bytes) binary += String.fromCharCode(byte);

          const ideURL = new URL('https://chuck.stanford.edu/ide/');
          ideURL.searchParams.set('share', btoa(binary));
          ideWindow.location.href = ideURL.toString();
        } catch (error) {
          ideWindow.close();
          console.error('Could not create a WebChucK share link:', error);
          alert('Could not prepare the code for WebChucK IDE. See the console for details.');
        }
      });

      
    </script>
