    <script id="chuck" type="chuck">//---------------------------------------------------------------
// name: autotune.ck
// desc: because no one asked for it
//       (and it shows how PitchTrack works)
//
// API reference for PitchTrack
// https://chuck.stanford.edu/doc/reference/chugins.html#PitchTrack
//
// required data file:
// https://chuck.stanford.edu/doc/examples/effects/data/obama.wav
//
// note: PitchTrack is a standard distribution chugin (ChucK plugin)
//       that is included with the macOS and Windows installers;
//       on Linux or if you are building chuck from source, you will
//       need to compile PitchTrack.chug for your system
//       https://github.com/ccrma/chugins/
//---------------------------------------------------------------

// ananlysis
SndBuf obama => PitchTrack tracker => blackhole;
// frame size
512 => tracker.frame;
// frame overlap
4 => tracker.overlap;

// synthesis
obama => HPF highpass => Delay del => PitShift autotune => Envelope fade => dac;
// high pass to get rid of the low din
100 => highpass.freq;

// ramp duration
1::second => fade.duration;
// set up envelope value and target
0 => fade.value;
1 => fade.target;

// input file name
"data/obama.wav" => string filename;
// print
cherr <= "reading input file: '" <= filename <= "'..." <= IO.nl();
// convert to full path relative to this file; read into SndBuf
me.dir() + filename => obama.read;

// modify the '0' to '1' to record a wav file of the output in real-time
// FYI to render faster-than-realtime, run this example with \`--silent\`
//     > chuck autotune.ck --silent
// FYI this code always records if --silent is enabled
if( 0 || !Machine.realtime() )
{
    dac => WvOut2 record => blackhole;
    // output file name
    "./autotuned-obama.wav" => string outfile;
    // print
    cherr <= "recording to file: '" <= outfile <= "'..." <= IO.nl();
    // set output file name
    me.dir() + outfile => record.wavFilename;
}
else
{
    // print
    cherr <= "recording to file: (disabled)" <= IO.nl();
}

// set delay using pitch tracker frame size
tracker.frame()::samp => del.delay;
// set input file to start
0 => obama.pos;
// length of input file
obama.length() => dur length;

// effect mix
1 => autotune.mix;
// start at 100% (no pitch shift yet)
1 => autotune.shift;

// echoing bells matching vocal pitch
TriOsc tri => ADSR env => Echo e => dac;
// some feedback for recirculating echoes
e => e;
// set oscilator gain
0.15 => tri.gain;
// set ADSR envelope
env.set(5::ms, 250::ms, 0, 0::ms);
// set delay
250::ms => e.max => e.delay;
// set echo
0.5 => e.mix;
// volume
0.8 => e.gain;

// m7 chord
[0, 3, 7, 10] @=> int pentatonic[];

// some variables we'll need later
float last_target;
// compute end time (not to be confused with end times, which is what we are living in)
now + length => time endtime;
// compute when to start fade out
now + (length - fade.duration()) => time fadetime;

// spork parallel processes (can comment out to remove their effect)

// scale switcher (chord progression generator)
spork ~ switchScale();
// play the ostinato pattern
spork ~ ostinato();

// for the duration of the file
while( now < endtime )
{
    // one sample at a time
    samp => now;
    // get pitch estimate
    tracker.get() => float track;

    // find closest pitch
    closest( track, pentatonic ) => float target;

    // only trigger new note if different from previous
    if( target > 60 && Std.fabs(target - last_target) > 0.1 )
    {
        1 => env.keyOn;
        target => tri.freq;
        target => last_target;
    }

    // perform autotune
    if( track > 0 ) target / track => autotune.shift;
    // begin fade out if the time is right
    if( now >= fadetime ) 0 => fade.target;
}

// wait a little extra time
5::second => now;

// hold pitch
fun void hold_pitch( float t )
{
    t => last_target;
    250::ms => now;
    -100 => last_target;
}

// scale switcher (chord progression generator)
fun void switchScale()
{
    while( true )
    {
        12::second => now;
        pentatonic[0]--;
        pentatonic[2]--;
        pentatonic[3]++;
        11.5::second => now;
        pentatonic[0]--;
        2 -=> pentatonic[1];
        pentatonic[2]--;
        3 -=> pentatonic[3];
        for (int i; i<pentatonic.size(); i++)
        {
            if (pentatonic[i] < -5) 12 +=> pentatonic[i];
        }
    }
}

// our repeated pattern
fun void ostinato()
{
    // modal bar into revert
    ModalBar mb => GVerb rev => fade;
    // set gain
    0.5 => mb.gain;
    // which Modal Bar preset
    1 => mb.preset;
    // 0.01 => rev.mix;

    // time loop
    while( true )
    {
        // go through the scale
        for( int degree : pentatonic )
        {
            // pitch to frequency and set in modal bar
            (degree + 48) => Std.mtof => mb.freq;
            // note one!
            1 => mb.noteOn;
            // for an 1/8 of a second
            125::ms => now;
        }
    }
}


// helper function to find equal tempered pitch in list
// which is closest to freq testval
fun float closest( float testval, int list[] )
{
    // list length
    list.size() => int len;

    int octave;
    // freq to midi note number
    Std.ftom(testval) => float testmidi;
    // calculate octave
    while( testmidi - (list[len-1] + octave) > 12 )
    {
        12 +=> octave;
    }

    48000.0 => float lowdiff;
    int closest_index;
    int closest_octave;

    // loop over list
    for( int i; i<len; i++ )
    {
        Std.mtof(octave + list[i]) => float listnote;
        Math.fabs(listnote - testval) => float diff;
        if (diff < lowdiff)
        {
            i => closest_index;
            diff => lowdiff;
            octave => closest_octave;
        }
    }

    // loop over list 8va
    for( int i; i<len; i++ )
    {
        Std.mtof(octave + 12 + list[i]) => float listnote;
        Math.fabs(listnote - testval) => float diff;
        if (diff < lowdiff)
        {
            i => closest_index;
            diff => lowdiff;
            octave + 12 => closest_octave;
        }
    }

    // convert back to freq
    return Std.mtof( closest_octave + list[closest_index] );
}</script>

    <script type="inline-module">
      import { Chuck } from 'https://cdn.jsdelivr.net/npm/webchuck/+esm';
      import chuckCode from '#chuck';

      const editor = newChuckEditor(document.getElementById("editor"), chuckCode);

      const states = Object.freeze({
        playing: 0,
        stopped: 1
      });
      let status = states.stopped;

      const action = document.querySelector('#action');
      const openInIDE = document.querySelector('#openInIDE');
      const downloadButton = document.querySelector('#download');
      const consoleOutput = document.querySelector('#chuck-console');

      let theChuck; // global variable

      // Show ChucK's output (<<< >>>, chout, errors) in the console panel.
      // textContent, not innerHTML, so output is never interpreted as HTML.
      function printToConsole(message) {
        consoleOutput.textContent += message + '\n';
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
      }

      // Download button: saves the original .ck file that sits next to this page
      // (the page generator fills in data-href with this example's filename)
      downloadButton.addEventListener('click', () => {
        const link = document.createElement('a');
        link.href = downloadButton.dataset.href;
        link.download = ''; // keep the file's own name
        document.body.appendChild(link);
        link.click();
        link.remove();
      });

      // Play button
      action.addEventListener('click', async () => {
        // Initial load
        if (theChuck === undefined) {
          action.disabled = true;
          action.innerHTML = "Loading...";
          theChuck = await Chuck.init( [] );
          theChuck.chuckPrint = printToConsole;
          action.disabled = false;
        }

        switch (status) {
          case states.playing:
            status = states.stopped;
            theChuck.removeLastCode();
            // Stop button
            action.innerHTML = `
              Play
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-play" viewBox="0 0 16 16">
                <path d="M10.804 8 5 4.633v6.734L10.804 8zm.792-.696a.802.802 0 0 1 0 1.392l-6.363 3.692C4.713 12.69 4 12.345 4 11.692V4.308c0-.653.713-.998 1.233-.696l6.363 3.692z"/>
              </svg>
            `;
            break;
          case states.stopped:
            status = states.playing;
            consoleOutput.textContent = ''; // fresh console for each run
            theChuck.runCode(editor.getValue());
            // Play button
            action.innerHTML = `
              Stop
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-stop" viewBox="0 0 16 16">
                <path d="M3.5 5A1.5 1.5 0 0 1 5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5zM5 4.5a.5.5 0 0 0-.5.5v6a.5.5 0 0 0 .5.5h6a.5.5 0 0 0 .5-.5V5a.5.5 0 0 0-.5-.5H5z"/>
              </svg>
            `;
            break;
        }
      });

      openInIDE.addEventListener('click', async () => {
        const ideWindow = window.open('about:blank', '_blank');
        if (!ideWindow) {
          alert('Please allow pop-ups to open your code in WebChucK IDE.');
          return;
        }
        ideWindow.opener = null;

        try {
          const title = document.querySelector('#title')?.textContent?.trim()
            || document.title.trim()
            || 'untitled';
          const fileName = `${title.replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_')}.ck`;
          const sharedFiles = [{ name: fileName, data: editor.getValue() }];
          const json = new TextEncoder().encode(JSON.stringify(sharedFiles));
          const compressed = await new Response(
            new Blob([json]).stream().pipeThrough(new CompressionStream('deflate'))
          ).arrayBuffer();
          const bytes = new Uint8Array(compressed);
          let binary = '';
          for (const byte of bytes) binary += String.fromCharCode(byte);

          const ideURL = new URL('https://chuck.stanford.edu/ide/');
          ideURL.searchParams.set('share', btoa(binary));
          ideWindow.location.href = ideURL.toString();
        } catch (error) {
          ideWindow.close();
          console.error('Could not create a WebChucK share link:', error);
          alert('Could not prepare the code for WebChucK IDE. See the console for details.');
        }
      });

      
    </script>
