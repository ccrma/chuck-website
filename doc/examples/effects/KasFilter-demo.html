    <script id="chuck" type="chuck">//Under-sampling based resonant Lowpass filter by Kassen
//Internal workings are explained in the source, for those who need that. 
//let's have a look at how to use it in practice here.

chout <= "hi there! \\n";
chout <= "Let's do some filtering! \\n";
chout <= "Let's start with a simple example: \\n";
chout <= "... \\n";
chout.flush();
BlitSaw s => KasFilter kf => dac; //we use a BlitSaw because it doesn't alias.

220 => s.freq;


Envelope ramp => blackhole; //our modulation signal.

220			=> ramp.value;
5::second	=> ramp.duration;
5000		=> ramp.target;

while (ramp.value() < ramp.target())
{
	ramp.value() => kf.freq;
	samp => now;
}
0 => s.freq;
0 => s.op;

chout <= "That sounded a bit like a filter and a bit like under-sampling, right? \\n";
chout <= "That's because that's exactly what's going on. \\n";
chout <= "But we can do more, we can add resonance to it, like a normal filter. \\n";
chout <= "Let's try the same sweep again, but now with some resonance. \\n";
chout <= "... \\n";
chout.flush();
2::second => now;

220			=> s.freq;
1			=> s.op;

220			=> ramp.value;
5::second	=> ramp.duration;
5000		=> ramp.target;
.85			=> kf.resonance;

while (ramp.value() < ramp.target())
{
	ramp.value() => kf.freq;
	samp => now;
}
0 => s.freq;
0 => s.op;


chout <= "With resonance there is a lot more emphasis on the filter sweep. \\n";
chout <= "It also brings the artefacts of this technique more to the foreground. \\n";
chout <= "That might be good or it could be bad, depending on what you want... \\n";
chout <= "I quite like it, so we can go one step further; \\n";
chout <= "We can also add a overdrive effect to this resonance, let's try that, \\n";
chout <= "we'll also turn the frequency of the input way down for the occasion.... \\n";
chout <= "... \\n";
chout.flush();
2::second => now;

8			=> s.freq;
1			=> s.op;

75			=> ramp.value;
5::second	=> ramp.duration;
1000		=> ramp.target;
.75			=> kf.accent;
.95			=> kf.resonance;

while (ramp.value() < ramp.target())
{
	ramp.value() => kf.freq;
	samp => now;
}
0 => s.freq;
0 => s.op;
chout <= "That's about it. \\n";
chout <= "I found it's especially good for lo-fi acid techna, \\n";
chout <= "it might be good for other things as well, \\n";
chout <= "Have fun! \\n";
chout.flush();

2::second => now;

/*
Documentation;
kf.freq(float) //sets the cutoff frequency.
	This sets both the frequency at which the 2 sample&holds sample the input signal
	and the frequency of the sine that crossfades between them.
kf.freq() //gets the cutoff frequency
kf.resonance(float) //sets the resonance, which is implemented as negative feedback.
	accepts values between 0 and 0.95
kf.resonance() // gets the resonance.
kf.accent(float) //sets the amount of waveshaping on the crossfading sine. 
	Ranges from 0 to 1, where 1 is close to regular under-sampling 
	(if no resonance is used).
kf.accent() //gets the accent value.

Please report bugs, problems or confusing bits to the ChucK mailing list.
If that fails or you need me for some other reason try;
signal [dot] automatique [at] gmail [another dot] com
*/</script>

    <script type="inline-module">
      import { Chuck } from 'https://cdn.jsdelivr.net/npm/webchuck/+esm';
      import chuckCode from '#chuck';

      const editor = newChuckEditor(document.getElementById("editor"), chuckCode);

      const states = Object.freeze({
        playing: 0,
        stopped: 1
      });
      let status = states.stopped;

      const action = document.querySelector('#action');
      const openInIDE = document.querySelector('#openInIDE');
      const downloadButton = document.querySelector('#download');
      const consoleOutput = document.querySelector('#chuck-console');

      let theChuck; // global variable

      // Show ChucK's output (<<< >>>, chout, errors) in the console panel.
      // textContent, not innerHTML, so output is never interpreted as HTML.
      function printToConsole(message) {
        consoleOutput.textContent += message + '\n';
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
      }

      // Download button: saves the original .ck file that sits next to this page
      // (the page generator fills in data-href with this example's filename)
      downloadButton.addEventListener('click', () => {
        const link = document.createElement('a');
        link.href = downloadButton.dataset.href;
        link.download = ''; // keep the file's own name
        document.body.appendChild(link);
        link.click();
        link.remove();
      });

      // Play button
      action.addEventListener('click', async () => {
        // Initial load
        if (theChuck === undefined) {
          action.disabled = true;
          action.innerHTML = "Loading...";
          theChuck = await Chuck.init( [] );
          theChuck.chuckPrint = printToConsole;
          action.disabled = false;
        }

        switch (status) {
          case states.playing:
            status = states.stopped;
            theChuck.removeLastCode();
            // Stop button
            action.innerHTML = `
              Play
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-play" viewBox="0 0 16 16">
                <path d="M10.804 8 5 4.633v6.734L10.804 8zm.792-.696a.802.802 0 0 1 0 1.392l-6.363 3.692C4.713 12.69 4 12.345 4 11.692V4.308c0-.653.713-.998 1.233-.696l6.363 3.692z"/>
              </svg>
            `;
            break;
          case states.stopped:
            status = states.playing;
            consoleOutput.textContent = ''; // fresh console for each run
            theChuck.runCode(editor.getValue());
            // Play button
            action.innerHTML = `
              Stop
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-stop" viewBox="0 0 16 16">
                <path d="M3.5 5A1.5 1.5 0 0 1 5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5zM5 4.5a.5.5 0 0 0-.5.5v6a.5.5 0 0 0 .5.5h6a.5.5 0 0 0 .5-.5V5a.5.5 0 0 0-.5-.5H5z"/>
              </svg>
            `;
            break;
        }
      });

      openInIDE.addEventListener('click', async () => {
        const ideWindow = window.open('about:blank', '_blank');
        if (!ideWindow) {
          alert('Please allow pop-ups to open your code in WebChucK IDE.');
          return;
        }
        ideWindow.opener = null;

        try {
          const title = document.querySelector('#title')?.textContent?.trim()
            || document.title.trim()
            || 'untitled';
          const fileName = `${title.replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_')}.ck`;
          const sharedFiles = [{ name: fileName, data: editor.getValue() }];
          const json = new TextEncoder().encode(JSON.stringify(sharedFiles));
          const compressed = await new Response(
            new Blob([json]).stream().pipeThrough(new CompressionStream('deflate'))
          ).arrayBuffer();
          const bytes = new Uint8Array(compressed);
          let binary = '';
          for (const byte of bytes) binary += String.fromCharCode(byte);

          const ideURL = new URL('https://chuck.stanford.edu/ide/');
          ideURL.searchParams.set('share', btoa(binary));
          ideWindow.location.href = ideURL.toString();
        } catch (error) {
          ideWindow.close();
          console.error('Could not create a WebChucK share link:', error);
          alert('Could not prepare the code for WebChucK IDE. See the console for details.');
        }
      });

      
    </script>
    <title>KasFilter-demo</title>
